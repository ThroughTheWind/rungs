# Gate table for the `instructions` module. Data only — no script enters the repo (ADR-0002).

# ── instructions-core-size ────────────────────────────────────────────────────
#
# Counts what is actually loaded: HTML comments are stripped by at least one harness before
# injection, so they do not count, and neither does frontmatter.

[file_budget]
file        = "AGENTS.md"
max_lines   = {{core_budget}}
ignore      = ["html_comments", "frontmatter"]
warn_at     = 0.8
message     = """
AGENTS.md is over its {{core_budget}}-line budget. Move the most path-specific section into
.ai/rules/ — that is what the budget is for. Merged module fragments count toward it, so a fragment
that has grown past ~15 lines is usually the one to look at first.
"""

# ── instructions-render-current ───────────────────────────────────────────────

# `id` is matched against the gate id (`instructions-render-current` contains `render`).
# It was `rules`, which no gate id contains, so the selector kept both entries and this
# gate also judged the repo-map block — the other gate's job (WI-087).
[[render_freshness]]
id      = "render"
sources = [".ai/rules/**/*.md"]
exclude = [".ai/rules/README.md"]   # the scaffold doc is not a rule
targets = [".claude/rules/**/*.md", ".github/instructions/**/*.instructions.md", ".cursor/rules/**/*.mdc"]
command = "node .ai/rungs.mjs render"
# Targets are checked only for harnesses in the installed matrix; the rest are ignored rather
# than reported missing.

# ── instructions-repo-map-current ─────────────────────────────────────────────

[[render_freshness]]
id      = "repo-map"
block   = { file = "AGENTS.md", marker = "repo-map" }
derives = "directory-tree"
depth   = 2
command = "node .ai/rungs.mjs render"

# ── instructions-shell-backticks (hook: pre-tool-use) ─────────────────────────
#
# Refuses a command that would let the shell expand backticks inside a double-quoted string.
# It permits every form the rule prescribes, and asserts BOTH directions below, because a guard
# that also refuses its own fix is one people disable.

[shell_safety]
refuse = [
  { pattern = "node\\s+-e\\s+\"[^\"]*`", why = "backtick inside a double-quoted -e string is command substitution" },
  { pattern = "python\\s+-c\\s+\"[^\"]*`", why = "same trap, Python" },
  { pattern = "<<\\s*EOF", why = "unquoted heredoc is shell-expanded; use <<'EOF'" },
]
permit = [
  "script file invocation",
  "single-quoted -e string",
  "<<'EOF'",
  "escaped backtick",
]
message = "Write the script to a file and run it. A file has no shell quoting layer, so backticks are just characters."

# ── self-tests ────────────────────────────────────────────────────────────────
#
# Both directions, always. A gate whose rules are currently satisfied is indistinguishable from a
# gate that matches nothing.

[[self_test]]
gate   = "instructions-shell-backticks"
expect = "fail"
input  = "node -e \"fs.writeFileSync('a.md', 'see `foo`')\""

[[self_test]]
gate   = "instructions-shell-backticks"
expect = "pass"
input  = "node scripts/edit.mjs"

[[self_test]]
gate   = "instructions-shell-backticks"
expect = "pass"
input  = "cat <<'EOF' > a.md"

[[self_test]]
gate   = "instructions-shell-backticks"
expect = "fail"
input  = "cat <<EOF > a.md"

[[self_test]]
gate   = "instructions-core-size"
expect = "fail"
fixture = { file = "AGENTS.md", lines = 9999 }

[[self_test]]
gate   = "instructions-core-size"
expect = "pass"
fixture = { file = "AGENTS.md", lines = 10 }

# ── render-freshness self-tests ───────────────────────────────────────────────

[[self_test]]
gate    = "instructions-render-current"
expect  = "fail"
fixture = { sources = [".ai/rules/backend.md"], targets = [] }

[[self_test]]
gate    = "instructions-render-current"
expect  = "pass"
fixture = { sources = [".ai/rules/backend.md"], targets = [".claude/rules/backend.md"] }

[[self_test]]
gate    = "instructions-repo-map-current"
expect  = "fail"
fixture = { file = "AGENTS.md", blocks = [] }

[[self_test]]
gate    = "instructions-repo-map-current"
expect  = "pass"
fixture = { file = "AGENTS.md", blocks = ["repo-map"] }

# ── instructions-imperatives (explain-only) ───────────────────────────────────
#
# Evidence rows: file, line, the modal that matched. No verdict on enforcement, in either
# direction (ADR-0011). The shapes excluded below are the ones the hand-classified oracle found to
# be narrative rather than rules: past-tense modals, `never` before a noun phrase, `do not` with a
# subject, headings, code spans and fenced blocks.

[imperative_census]
scan    = ["AGENTS.md", "CLAUDE.md", ".ai/rules/**/*.md", ".claude/rules/**/*.md", ".github/instructions/**/*.md", ".github/copilot-instructions.md", ".cursor/rules/**/*.mdc"]
exclude = ["node_modules/**", ".ai/rules/README.md"]
message = """
{count} imperative line(s) across {files} instruction file(s). This is a census, not a verdict:
whether a rule is checked cannot be read from the sentence that states it, so nothing here says
which rules are enforced. Each row is a candidate for the harden-rule ladder — a sentence, a
skill line, a path-scoped rule, or a gate.
"""

# ── instructions-stale-commands ───────────────────────────────────────────────
#
# A command named in an instruction file whose surface exists and does not contain it. Two surfaces
# are read — package.json scripts for `npm|pnpm|yarn run <script>`, and the commands this CLI
# dispatches for `rungs <command>` in any spelling. No surface, no finding.

[command_reference]
scan         = ["AGENTS.md", "CLAUDE.md", ".ai/rules/**/*.md", ".claude/rules/**/*.md", ".github/instructions/**/*.md", ".github/copilot-instructions.md", ".cursor/rules/**/*.mdc"]
exclude      = ["node_modules/**"]
package_json = "package.json"
message      = """
{file} names a command its surface does not have. An instruction that cannot be followed is worse
than none: the reader assumes the file is current and the tool is broken.
"""

# ── self-tests: imperatives ───────────────────────────────────────────────────
#
# A rule fires; the narrative shapes the oracle classified as not-a-rule do not.

[[self_test]]
gate   = "instructions-imperatives"
expect = "fail"
input  = "**Never weaken a gate to make a change pass**; if a gate is wrong that is its own item."

[[self_test]]
gate   = "instructions-imperatives"
expect = "fail"
input  = "Status must agree with git, and the check enforces it."

[[self_test]]
gate   = "instructions-imperatives"
expect = "fail"
input  = "Do not surface it as an open question, do not lay out options, and do not ask the owner to confirm."

[[self_test]]
gate   = "instructions-imperatives"
expect = "pass"
input  = "Meraki has never served them, and the nine originally-archived champions were never a press at all."

[[self_test]]
gate   = "instructions-imperatives"
expect = "pass"
input  = "Codex and Claude do not share memory; they do not prove actor identity."

[[self_test]]
gate   = "instructions-imperatives"
expect = "pass"
input  = "## Editing files from the shell (MANDATORY)"

[[self_test]]
gate   = "instructions-imperatives"
expect = "pass"
input  = "The rule reads `Never pipe a multi-line edit through node -e` and the hook enforces it."

# ── self-tests: stale commands ────────────────────────────────────────────────
#
# `scripts` is the package.json surface the fixture builds; omitting it means no surface exists, and
# no surface means no finding.

[[self_test]]
gate    = "instructions-stale-commands"
expect  = "fail"
input   = "Run `npm run lint` before pushing."
fixture = { scripts = ["build", "test"] }

[[self_test]]
gate    = "instructions-stale-commands"
expect  = "pass"
input   = "Run `npm run build` before pushing."
fixture = { scripts = ["build", "test"] }

[[self_test]]
gate    = "instructions-stale-commands"
expect  = "pass"
input   = "Run `npm run lint` before pushing."

# The phantom commands sit in fenced blocks, which the detector reads like code spans; written as
# spans they would be command claims to this repository's own `module-commands-exist` gate, which
# is right to refuse a phantom in a shipped table.
[[self_test]]
gate    = "instructions-stale-commands"
expect  = "fail"
input   = "Move finished items to the archive:\n\n```bash\nnode .ai/rungs.mjs backlog prune\n```"

[[self_test]]
gate    = "instructions-stale-commands"
expect  = "pass"
input   = "Move finished items with `node .ai/rungs.mjs backlog archive`, never by hand."

[[self_test]]
gate    = "instructions-stale-commands"
expect  = "fail"
input   = "Then gate the release:\n\n```console\n$ node .ai/rungs.mjs verify\n```"
