# Gate table for the `findings` module.

# ── findings-ids ──────────────────────────────────────────────────────────────

[kinds.finding]
format  = "{{id_prefix}}-\\d{1,4}"
marker  = { file = "{{path}}", pattern = "NEXT-ID: ({{id_prefix}}-\\d{1,4})" }
sources = ["{{path}}"]

[citations]
roots      = ["docs", "AGENTS.md", "CLAUDE.md", ".ai"]
extensions = [".md", ".toml"]

# ── findings-disposition-has-reason ───────────────────────────────────────────

[register_schema]
file          = "{{path}}"
table         = "Closed"
required_cols = ["Id", "What", "Disposition", "Reason"]
enum          = { Disposition = ["promoted", "fixed", "dismissed"] }
non_empty     = ["Reason"]
min_words     = { Reason = 4 }
message       = """
Finding {id} is closed as `{disposition}` with no reason. A dismissal without a reason is the
observation being recorded again next month by someone who cannot tell it was already considered.
"""

# The Open table's evidence column is checked for presence, not for quality — a gate cannot judge
# whether evidence is good, and one that tried would be the confidently-wrong probe.
[register_schema.open]
table     = "Open"
non_empty = ["Sev", "Pri", "What", "Evidence"]
enum      = { Sev = ["high", "medium", "low"], Pri = ["now", "next", "someday"] }
placeholder_ok = ["none — hunch", "unknown"]

# ── findings-self-declared-closure ───────────────────────────────────────────

[self_declared_closure]
file                    = "{{path}}"
open_heading            = "Open"
closed_heading          = "Closed"
detail_heading          = "Detail"
id_pattern              = "{{id_prefix}}-\\d{1,4}"
# The bracket is optional: rows read `| F-054 | …`. Requiring it meant no real row
# ever matched and this gate examined nothing on any consumer until its fixture ran (WI-087).
open_row_pattern        = "^\\|\\s*\\[?({{id_prefix}}-\\d{1,4})\\]?"
detail_heading_pattern  = "^###\\s+({{id_prefix}}-\\d{1,4})\\s+—\\s+"
exempt_marker           = "closure-ok:"
declares_fixed          = [
  "\\*\\*Fixed[.,)*]",
  "\\*\\*Fixed\\s+(?:in|by|the\\s+same\\s+day|\\d{4}-\\d{2}-\\d{2})",
  "\\*\\*Implemented in this change\\.?\\*\\*",
  "\\*\\*fixed in the pass that found it\\*\\*",
]

# ── self-tests ────────────────────────────────────────────────────────────────

[[self_test]]
gate    = "findings-disposition-has-reason"
expect  = "fail"
fixture = { table = "Closed", row = { Id = "{{id_prefix}}-001", What = "x", Disposition = "dismissed", Reason = "" } }

[[self_test]]
gate    = "findings-disposition-has-reason"
expect  = "pass"
fixture = { table = "Closed", row = { Id = "{{id_prefix}}-001", What = "x", Disposition = "dismissed", Reason = "the mapper already handles this case" } }

[[self_test]]
gate    = "findings-disposition-has-reason"
expect  = "fail"
fixture = { table = "Open", row = { Id = "{{id_prefix}}-002", Sev = "critical", Pri = "now", What = "x", Evidence = "y" } }

[[self_test]]
gate    = "findings-disposition-has-reason"
expect  = "pass"
fixture = { table = "Open", row = { Id = "{{id_prefix}}-002", Sev = "high", Pri = "now", What = "x", Evidence = "none — hunch" } }

[[self_test]]
gate    = "findings-disposition-has-reason"
expect  = "pass"
fixture = { table = "Open", row = { Id = "—", Sev = "", Pri = "", What = "*nothing open*", Evidence = "" } }

[[self_test]]
gate    = "findings-self-declared-closure"
expect  = "fail"
fixture = { open = ["{{id_prefix}}-001"], detail = "### {{id_prefix}}-001 — x\\n\\n**Fixed.**" }

[[self_test]]
gate    = "findings-self-declared-closure"
expect  = "pass"
fixture = { open = ["{{id_prefix}}-001"], detail = "### {{id_prefix}}-001 — x\\n\\n<!-- closure-ok: the mitigation only -->\\n**Fixed.**" }

# ── findings-ids self-tests ───────────────────────────────────────────────────

[[self_test]]
gate    = "findings-ids"
expect  = "fail"
fixture = { register_rows = ["{{id_prefix}}-001", "{{id_prefix}}-001"] }

[[self_test]]
gate    = "findings-ids"
expect  = "pass"
fixture = { register_rows = ["{{id_prefix}}-001", "{{id_prefix}}-002"] }
