# Gate run for rungs itself.
#
# Written by hand rather than by `rungs add ci`, because this repo needs the one thing the module's
# template deliberately does not ship: a **platform matrix**. Everything in this repository had only
# ever been verified on Windows — including, as of 2026-08-17, four commands that drive `git
# worktree`, manipulate paths, and probe process liveness with `process.kill(pid, 0)`. That is the
# largest untested surface in a package that is already published.
#
# The module's own template is the single-platform shape a consumer starts from; this is what the
# comment at the bottom of that file tells you to do when you need more.
name: checks

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  # One run per ref. A superseded run tells you about a tree nobody has any more.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    strategy:
      # Never cancel the others on one failure. The whole question this matrix answers is
      # *which* platforms differ, and fail-fast deletes that answer on the first red cell.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22.18 is the floor `engines` declares; 22.x is what most people will actually run.
        # A floor nobody tests is a number in a manifest.
        node: ['22.18', '22']
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Gates that compare against the merge base need history, and `land`'s own
          # tests create worktrees and merge. A shallow clone breaks both.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # `land` and `session start` commit; git refuses without an identity, and the
      # runner has none by default. This is test scaffolding, not repo configuration.
      - name: Give git an identity
        run: |
          git config --global user.email "checks@rungs.invalid"
          git config --global user.name "rungs checks"

      - run: npm ci

      # `pretest` builds, so this also proves the bundled executable compiles on
      # every cell — the failure v0.1.1 shipped was exactly a build/runtime mismatch.
      - run: npm test

      # Every gate in .ai/gates.toml, the same set and order as a local run.
      - name: Run gates
        run: node --experimental-strip-types src/cli.ts check

      # The published entry point, not the sources. These are different files and
      # only one of them is what a consumer executes.
      - name: Smoke the built executable
        run: node dist/cli.js --help

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix site
      # Type check, link check and build. The link check is what catches a doc
      # citing a file that moved — which archiving does in bulk.
      - run: npm run check --prefix site
      - run: npm run build --prefix site
